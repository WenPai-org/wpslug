<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置 — WPSlug 1.3 原型</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="top">
  <strong>WPSlug</strong>
  <a class="tab" href="overview.html">概览</a>
  <a class="tab on" href="settings.html">设置</a>
  <a class="tab" href="tools.html">工具</a>
</div>
<div class="wrap">
  <h1>设置</h1>
  <p class="lede">简单默认。拼音 / 音译 / 翻译 / SEO / 媒体细节进高级。</p>
  <p class="seg"><a class="on" href="settings.html">简单</a><a href="settings-advanced.html">高级</a></p>
  <div class="card">
    <p>启用转换</p>
    <p>转换模式（choice 卡，不是下拉）：</p>
    <p class="choice">
      <span class="on">本地拼音</span>
      <span>文派心思 · 语义拼音</span>
      <span>翻译</span>
      <span>音译</span>
    </p>
    <p>心思状态在这一页，不藏进高级。无 WPMind 时本地拼音兜底。额度不在本插件充值。</p>
    <p>仅在发布时转换（现行 key）</p>
    <p><button class="btn" type="button">保存更改</button></p>
  </div>
</div>
<div class="foot">1.3 原型 · 选项 key 不动 · 等 APPROVAL.md</div>
</body>
</html>
