name: WordPress 插件 CI

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

jobs:
  ci:
    if: github.repository != 'WenPai-org/ci-workflows'
    runs-on: linux-arm64
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: PHP Parallel Lint
        run: |
          parallel-lint --exclude vendor --exclude node_modules .

      - name: Verify Node.js toolchain
        run: |
          node --version
          npm --version

      - name: Install test dependencies
        run: npm ci

      - name: Install PHP quality dependencies
        env:
          COMPOSER_MAX_PARALLEL_HTTP: '1'
        run: composer install --no-interaction --prefer-source --no-progress

      - name: Focused first-party PHPCS
        run: composer phpcs

      - name: PHPStan with WordPress stubs
        run: composer phpstan

      - name: PHP behavior tests
        run: npm run test:php

      - name: Audit development dependencies
        run: npm audit --registry=https://registry.npmjs.org

      - name: Prepare WordPress 7.0.3 Playground assets
        run: |
          set -euo pipefail
          ASSET_DIR=$(mktemp -d /tmp/wpslug-wp-env.XXXXXX)
          CORE_DIR="${ASSET_DIR}/wordpress-core"
          git clone --quiet --depth=1 --branch 7.0.3 \
            https://github.com/WordPress/WordPress.git "${CORE_DIR}"
          test "$(git -C "${CORE_DIR}" rev-parse HEAD)" = "9a094f4669547cea86ca354d1fb4d9fd9961028c"
          grep -Fq "\$wp_version = '7.0.3';" "${CORE_DIR}/wp-includes/version.php"
          jq --arg core "${CORE_DIR}" --arg plugin "${PWD}" \
            '.core = $core | .plugins = [$plugin] | .config.WP_HOME = "http://localhost:8888" | .config.WP_SITEURL = "http://localhost:8888"' \
            .wp-env.json > "${ASSET_DIR}/wp-env.json"
          echo "WPSLUG_WP_ENV_CONFIG=${ASSET_DIR}/wp-env.json" >> "${GITHUB_ENV}"

      - name: WordPress 7.0.3 Playground E2E
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/sbin/chromium-browser
          WP_BASE_URL: http://localhost:8888
        run: |
          test -x "${PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH}"
          npx wp-env start --runtime=playground --config "${WPSLUG_WP_ENV_CONFIG}"
          npm test

      - name: Stop WordPress Playground
        if: always()
        run: |
          if [ -n "${WPSLUG_WP_ENV_CONFIG:-}" ]; then
            npx wp-env stop --runtime=playground --config "${WPSLUG_WP_ENV_CONFIG}" || true
          fi

      - name: Gitleaks 密钥泄露扫描
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            gitleaks detect --source=. --log-opts="$GITHUB_SHA~1..$GITHUB_SHA" --verbose --exit-code 1
          else
            gitleaks detect --source=. --verbose --exit-code 1
          fi
          echo "gitleaks 扫描通过"
