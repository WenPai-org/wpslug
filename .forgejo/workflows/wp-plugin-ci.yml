name: WordPress 插件 CI

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

jobs:
  ci:
    if: github.repository != 'WenPai-org/ci-workflows'
    runs-on: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP Parallel Lint
        run: |
          parallel-lint --exclude vendor --exclude node_modules .

      - name: Verify Node.js toolchain
        run: |
          node --version
          npm --version

      - name: Install test dependencies
        run: npm ci

      - name: Install PHP quality dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Focused first-party PHPCS
        run: composer phpcs

      - name: PHPStan with WordPress stubs
        run: composer phpstan

      - name: PHP behavior tests
        run: npm run test:php

      - name: Audit development dependencies
        run: npm audit --registry=https://registry.npmjs.org

      - name: WordPress 7.0.3 E2E
        run: |
          npm run wp-env:start
          npx wp-env run cli wp plugin install plugin-check --activate
          npx wp-env run cli wp plugin check wpslug \
            --mode=update \
            --ignore-codes=plugin_updater_detected,trademarked_term \
            --ignore-warnings \
            --exclude-directories=lib,tests,docs,scripts,vendor,node_modules \
            --exclude-files=.ci-trigger,.wp-env.json,composer.json,composer.lock,package.json,package-lock.json,phpcs.xml.dist,phpstan.neon.dist \
            --format=strict-table
          npm test

      - name: Stop WordPress test environment
        if: always()
        run: npm run wp-env:stop

      - name: Gitleaks 密钥泄露扫描
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            gitleaks detect --source=. --log-opts="$GITHUB_SHA~1..$GITHUB_SHA" --verbose --exit-code 1
          else
            gitleaks detect --source=. --verbose --exit-code 1
          fi
          echo "gitleaks 扫描通过"
